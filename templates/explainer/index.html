<!doctype html>
<html lang="__HTML_LANGUAGE__">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=720,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="__BRAND_LOGO__">
    <link rel="stylesheet" href="../../render-engine/style.css">
    <title>__BRAND_NAME__ | __TITLE__</title>
    <style>
      h1{font-size:30px}#stage{transition:opacity .2s ease-out}
    </style>
  </head>
  <body>
    <main>
      <div class="ambient"></div><div class="top-rule"></div>
      <div id="main-ui" class="main-ui">
        <div class="brand"><img src="__BRAND_LOGO__" alt="" decoding="sync" fetchpriority="high"><div class="brand-name">__BRAND_NAME__</div></div>
        <div class="eyebrow">ONE SENTENCE. ONE VIDEO.</div>
        <div class="kicker">__BRAND_NAME__</div><div class="level-line">VIDEO EXPLAINER</div><h1 id="header-title">__TITLE__</h1>
        <div id="stage"></div><div id="caption" class="caption"></div>
        <div class="status"><span id="status-label">EXPLAINER</span><strong id="status-text">FOLLOW THE IDEA</strong></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <div id="cover" class="cover">
        <div class="cover-brand"><img src="__BRAND_LOGO__" alt="" decoding="sync" fetchpriority="high"><div class="cover-brand-name">__BRAND_NAME__</div></div>
        <div class="cover-eyebrow">ONE SENTENCE. ONE VIDEO.</div><div class="cover-rule"></div>
        <div class="cover-grid"><div id="cover-track" class="cover-track"></div><i class="cover-node" style="left:18%"></i><i class="cover-node" style="left:49%"></i><i class="cover-node" style="left:80%"></i><i id="cover-packet"></i></div>
        <div id="cover-kicker" class="cover-kicker">__BRAND_NAME__</div>
        <div id="cover-level" class="cover-level">STANDALONE EXPLAINER</div>
        <h2 id="cover-title" class="cover-title">__TITLE__</h2>
        <div id="cover-bottom" class="cover-bottom"><span class="cover-prompt">WHAT IF...?</span><span class="cover-hook">__HOOK__</span></div>
        <div id="cover-caption" class="caption cover-caption"></div>
      </div>
      <div class="grain"></div>
    </main>
    <script>
      window.PROJECT_CONFIG={
        title:document.getElementById('header-title').textContent,variant:'custom',coverSeconds:1,voiceStartsAtZero:true,coverSubtitleDelay:.3,coverSize:68,headerSize:30,
        brand:{name:__BRAND_NAME_JS__,tagline:'ONE SENTENCE. ONE VIDEO.',logoFile:__BRAND_LOGO_JS__,outro:__BRAND_OUTRO_JS__},
        scenes:[
          {startRatio:0,label:'INTRODUCE THE PROBLEM',note:'CUSTOM VISUAL NEEDED',status:'SHOW THE VIEWER WHY IT MATTERS',headline:'REPLACE WITH THE FIRST VISUAL BEAT'},
          {startRatio:.34,label:'EXPLAIN THE MECHANISM',note:'CUSTOM VISUAL NEEDED',status:'REVEAL A MEANINGFUL STATE CHANGE',headline:'REPLACE WITH THE NEXT VISUAL BEAT'},
          {startRatio:.68,label:'SHOW THE RESULT',note:'CUSTOM VISUAL NEEDED',status:'LAND THE MAIN TAKEAWAY',headline:'REPLACE WITH THE FINAL VISUAL BEAT'}
        ]
      };
    </script>
    <script src="scene.js"></script><script src="../../render-engine/player.js"></script>
  </body>
</html>
